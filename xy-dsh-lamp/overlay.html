<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH LAMP</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --line: #2a3050;
      --edge: rgba(255, 255, 255, .10);
      --sheen: rgba(255, 255, 255, .05);
      --amber: #ffa02f;
      --wait: #3fa9ff;
      --up: #00b96b;
      --down: #f23645;
      --mute: #5e6680;
      --ink: #e8ecf4;
      --idle: #3a425c;
    }
    /* Background choices. The first block is the default (深蓝); the rest only
       override what they change. Lamp colours move with the background because
       amber on a light card is not readable. */
    body[data-bg="black"] {
      --bg: #000000;
      --line: #262629;
      --edge: rgba(255, 255, 255, .13);
      --sheen: rgba(255, 255, 255, .06);
      --mute: #6d6d73;
      --ink: #ededf0;
      --idle: #3c3c40;
      --up: #00c476;
      --down: #ff3b4a;
    }
    body[data-bg="slate"] {
      --bg: #1c1c1e;
      --line: #34343a;
      --edge: rgba(255, 255, 255, .11);
      --sheen: rgba(255, 255, 255, .05);
      --mute: #8b8b93;
      --ink: #f0f0f2;
      --idle: #4a4a50;
      --amber: #ffb04a;
      --wait: #5cb3ff;
      --up: #2ecc8f;
      --down: #ff5a66;
    }
    /* Translucent: the window is already transparent, so the desktop reads
       through the card. Not real vibrancy (that needs an NSVisualEffectView). */
    body[data-bg="glass"] {
      --bg: rgba(12, 16, 26, .78);
      --line: rgba(122, 142, 190, .30);
      --edge: rgba(255, 255, 255, .17);
      --sheen: rgba(255, 255, 255, .10);
      --mute: #97a4c0;
      --ink: #eef2fa;
      --idle: rgba(126, 140, 172, .60);
      --amber: #ffab45;
      --wait: #56b4ff;
      --up: #16cf85;
      --down: #ff4a58;
    }
    body[data-bg="light"] {
      --bg: #f5f7fb;
      --line: #d6dde9;
      --edge: rgba(20, 30, 50, .13);
      --sheen: rgba(255, 255, 255, .85);
      --mute: #6f7b93;
      --ink: #1b2436;
      --idle: #aab3c5;
      --amber: #c97700;
      --wait: #0b74c4;
      --up: #00875a;
      --down: #cf1f2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      overflow: hidden;
    }
    body {
      font-family: "SF Mono", ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", monospace;
      font-size: 11px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- expanded board ---- */
    .card {
      display: inline-flex;
      flex-direction: column;
      /* Always the natural content width: never constrain this against the
         window, or the host can shrink the window to the collapsed size and
         the card would then measure itself against that tiny viewport. */
      width: max-content;
      background: var(--bg);
      border: 1px solid var(--edge);
      border-radius: 10px;
      box-shadow: inset 0 1px 0 var(--sheen);
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }
    .card[hidden] { display: none; }
    .card:active { cursor: grabbing; }

    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 5px 9px;
      border-bottom: 1px solid var(--line);
      line-height: 1.2;
    }
    .head[data-flat="1"] { border-bottom: 0; padding-bottom: 6px; }
    .mark { color: var(--amber); font-weight: 500; letter-spacing: .02em; }
    .head[data-tone="wait"] .mark { color: var(--wait); }
    .head[data-tone="idle"] .mark { color: var(--mute); }
    .head[data-tone="err"] .mark { color: var(--down); }
    .head[data-tone="ok"] .mark { color: var(--up); }
    .note { color: var(--ink); }
    .gap { flex: 1 1 auto; min-width: 10px; }
    .clock { color: var(--mute); font-variant-numeric: tabular-nums; }

    .fold {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--mute);
      font: inherit;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .fold:hover { border-color: var(--amber); color: var(--amber); }
    .fold:active { background: var(--line); }

    .lang {
      flex: 0 0 auto;
      height: 15px;
      min-width: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--mute);
      font: inherit;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .lang:hover { border-color: var(--amber); color: var(--amber); }
    .lang:active { background: var(--line); }

    /* Quitting costs a DSH restart to undo, so it takes two clicks. */
    .quit {
      flex: 0 0 auto;
      height: 15px;
      min-width: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--mute);
      font: inherit;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .quit:hover { border-color: var(--down); color: var(--down); }
    .quit[data-armed="1"] {
      border-color: var(--down);
      background: var(--down);
      color: #fff;
    }

    /* One row per session; the left column names the project. */
    .rows { display: flex; flex-direction: column; }
    .rows[hidden] { display: none; }
    .row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .who {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      width: 74px;
      padding: 4px 7px 5px 9px;
      border-right: 1px solid var(--line);
      font-size: 9px;
      line-height: 1.25;
      letter-spacing: .04em;
      color: var(--mute);
      overflow: hidden;
    }
    /* The card sets nowrap for the rows; the label must opt back into wrapping.
       min-width:0 is also required, or the flex item refuses to shrink. */
    .who > span { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .card[data-who="0"] .who { display: none; }
    .cell {
      flex: 1 1 auto;
      min-width: 56px;
      padding: 4px 7px 6px;
      border-right: 1px solid var(--line);
    }
    .cell:last-child { border-right: 0; }
    .k { font-size: 9px; color: var(--mute); letter-spacing: .06em; }
    .v { margin-top: 2px; display: flex; align-items: center; gap: 5px; line-height: 1.2; }

    /* ---- lamps ---- */
    .lamp { width: 6px; height: 6px; background: var(--c, var(--idle)); flex: 0 0 auto; }
    .lamp[data-state="idle"] { --c: var(--idle); }
    .lamp[data-state="run"] { --c: var(--amber); }
    .lamp[data-state="wait"] { --c: var(--wait); animation: blink 1s steps(1) infinite; }
    .lamp[data-state="err"] { --c: var(--down); }
    .lamp[data-state="done"] { --c: var(--up); }
    /* The dim phase must stay recognisably blue: at .3 it read as the idle grey. */
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .lamp { animation: none !important } }

    /* ---- collapsed: a single lamp ---- */
    .mini {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      /* min-width, not width: the box has to grow with the lamp count. */
      min-width: 30px;
      padding: 0 6px;
      height: 30px;
      background: var(--bg);
      border: 1px solid var(--edge);
      border-radius: 10px;
      box-shadow: inset 0 1px 0 var(--sheen);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .mini[hidden] { display: none; }
    .mini:active { cursor: grabbing; }
    /* One lamp per running task, not one summary lamp. */
    .mini .lamp { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="head" id="head" data-tone="run">
      <span class="mark" id="mark">IDLE</span>
      <span class="note" id="note">ROOT</span>
      <span class="gap"></span>
      <span class="clock" id="clock">00:00:00</span>
      <button class="lang" id="lang" type="button">中</button>
      <button class="fold" id="fold" type="button" title="收起灯板">&#8722;</button>
      <button class="quit" id="quit" type="button" title="退出灯板">&#215;</button>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="mini" id="mini" title="展开灯板" hidden></div>

  <script>
    /* Two label sets. `mark` is the headline word in the header, `cell` is the
       word under each lamp (English distinguishes DONE from OK). Agent codes
       come from the host as ROOT / A1 / A2…, so the Chinese set renames them
       主 / 子1 / 子2… at render time. */
    const LANGS = {
      zh: {
        mark: { idle: '待命', run: '工作中', wait: '等你', err: '出错', done: '完成' },
        cell: { idle: '待命', run: '工作中', wait: '等你', err: '出错', done: '完成' },
        root: '主',
        child: (n) => `子${n}`,
        fold: '收起灯板',
        unfold: '展开灯板',
        swap: '切换中英文',
        quit: '退出灯板',
        quitConfirm: '再点一次确认退出（重启 DSH 才会回来）',
        sessions: (n) => `${n} 个会话`,
      },
      en: {
        mark: { idle: 'IDLE', run: 'RUN', wait: 'ASK', err: 'ERR', done: 'DONE' },
        cell: { idle: 'IDLE', run: 'RUN', wait: 'ASK', err: 'ERR', done: 'OK' },
        root: 'ROOT',
        child: (n) => `A${n}`,
        fold: 'Collapse board',
        unfold: 'Expand board',
        swap: 'Switch language',
        quit: 'Quit the board',
        quitConfirm: 'Click again to confirm (needs a DSH restart to return)',
        sessions: (n) => `${n} sessions`,
      },
    }

    const el = {
      card: document.getElementById('card'),
      head: document.getElementById('head'),
      mark: document.getElementById('mark'),
      note: document.getElementById('note'),
      clock: document.getElementById('clock'),
      rows: document.getElementById('rows'),
      fold: document.getElementById('fold'),
      lang: document.getElementById('lang'),
      quit: document.getElementById('quit'),
      mini: document.getElementById('mini'),
    }

    // The host injects this before the page runs, so the first painted frame is
    // already the right face (no expand-then-snap on restart).
    /* Background ids and their bilingual labels. The host's right-click menu is
       built from this list, so a theme is added in exactly one place. */
    const BACKGROUNDS = [
      ['navy', '深蓝', 'Navy'],
      ['black', '纯黑', 'Black'],
      ['slate', '石墨', 'Slate'],
      ['glass', '半透明', 'Glass'],
      ['light', '浅色', 'Light'],
    ]
    const BG_IDS = BACKGROUNDS.map((b) => b[0])
    window.__lampBackgrounds = BACKGROUNDS

    let collapsed = Boolean(window.__lampInitialCollapsed)
    // Injected before the page runs, so the first painted frame is already the
    // chosen background instead of flashing the default.
    let background = BG_IDS.includes(window.__lampInitialBg) ? window.__lampInitialBg : 'navy'
    let lang = 'zh'
    // Once the button is used, the local choice wins: a poll that started
    // before the POST landed must not flip the labels back.
    let langPinned = false
    let lastData = { mark: 'IDLE', note: 'ROOT', elapsedMs: 0, agents: [] }

    const L = () => LANGS[lang] || LANGS.zh


    /** ROOT / A3 are the host's identifiers; show them the reader's way. */
    function codeLabel(code) {
      const text = String(code ?? '')
      const child = /^A(\d+)$/.exec(text)
      if (child) return L().child(child[1])
      return text === 'ROOT' ? L().root : text
    }

    /** One row per session. An older host sends only a flat agent list — treat
        that as a single unnamed session so the board still renders. */
    function sessionsOf(data) {
      if (Array.isArray(data.sessions) && data.sessions.length) return data.sessions
      const agents = Array.isArray(data.agents) ? data.agents : []
      return [{
        id: 'all',
        name: '',
        title: data.title || '',
        active: data.note || 'ROOT',
        agents,
      }]
    }

    function fmt(ms) {
      const s = Math.floor((Number(ms) || 0) / 1000)
      const m = Math.floor(s / 60)
      const h = Math.floor(m / 60)
      return `${String(h).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
    }

    /** One lamp colour for the whole run: error > waiting > done > running > idle. */
    function overall(data, agents) {
      const mark = data.mark || 'IDLE'
      if (mark === 'ERR' || agents.some((a) => a.state === 'err')) return 'err'
      if (mark === 'ASK' || agents.some((a) => a.state === 'wait')) return 'wait'
      if (mark === 'DONE') return 'done'
      if (agents.some((a) => a.state === 'run')) return 'run'
      if (agents.length && agents.every((a) => a.state === 'done')) return 'done'
      return 'idle'
    }

    function paint(data) {
      lastData = data || lastData
      const sessions = sessionsOf(lastData)
      const agents = sessions.flatMap((s) => (Array.isArray(s.agents) ? s.agents : []))
      const state = overall(lastData, agents)
      const isDone = state === 'done'
      if (!langPinned && (lastData.lang === 'zh' || lastData.lang === 'en')) lang = lastData.lang

      // A finished run folds to a single line: DONE  <done>/<total>  <clock>
      const total = agents.length
      const doneCount = agents.filter((a) => a.state === 'done').length
      const line = isDone ? `${String(doneCount).padStart(2, '0')}/${String(total).padStart(2, '0')}` : ''
      // How many sessions are actually running, and how many rows we had to drop.
      const count = Number(lastData.count) || sessions.length
      const hidden = Math.max(0, count - sessions.length)

      el.head.dataset.tone =
        state === 'err' ? 'err' : state === 'wait' ? 'wait' : state === 'idle' ? 'idle' : isDone ? 'ok' : 'run'
      el.head.dataset.flat = isDone ? '1' : '0'
      el.mark.textContent = L().mark[state] || L().mark.idle
      el.note.textContent = isDone
        ? line
        : count > 1
          ? `${L().sessions(count)}${hidden ? ` +${hidden}` : ''}`
          : codeLabel(sessions[0]?.active || lastData.note || 'ROOT')
      el.note.style.color = isDone ? 'var(--mute)' : ''
      el.clock.textContent = fmt(lastData.elapsedMs)

      // The project column only earns its width when there is a name to show.
      el.card.dataset.who = sessions.some((s) => s.name) ? '1' : '0'
      el.rows.hidden = isDone
      renderRows(sessions, isDone)

      el.lang.textContent = lang === 'zh' ? '中' : 'EN'
      el.lang.title = L().swap
      el.fold.title = L().fold
      renderMini(sessions, state)
      // Every session, not just the first: with three projects running the
      // tooltip is the only place the whole picture fits.
      const who = sessions
        .map((s) => [s.name, s.title].filter(Boolean).join(' '))
        .filter(Boolean)
        .join('  ·  ')
      const head = `${L().mark[state] || L().mark.idle}${line ? ' ' + line : ''}`
        + `${count > 1 ? '  ' + L().sessions(count) : ''}  ${fmt(lastData.elapsedMs)}`
      el.mini.title = (who ? `${head}  ·  ${who}` : head).slice(0, 240)

      el.card.hidden = collapsed
      el.mini.hidden = !collapsed
      syncSize()
    }

    /* The collapsed face carries one lamp per session. Same rule as the rows:
       rebuild only when the lamp count changes, or the wait blink restarts. */
    let miniShape = null

    function renderMini(sessions, fallback) {
      const states = (sessions.length ? sessions : [{ state: fallback }]).map((s) => s.state || 'idle')
      const shape = String(states.length)
      if (shape !== miniShape) {
        miniShape = shape
        el.mini.innerHTML = states.map(() => '<span class="lamp" data-state="idle"></span>').join('')
      }
      const lamps = el.mini.children
      states.forEach((st, i) => {
        if (lamps[i]) lamps[i].dataset.state = st
      })
    }

    /* Rows are rebuilt only when their SHAPE changes. The poll runs every 400ms
       and used to replace innerHTML every time, which restarted the wait-lamp
       blink from 0% (so it never blinked) and swapped the label element out from
       under the cursor (so its tooltip never appeared). */
    let rowShape = null

    function renderRows(sessions, isDone) {
      const model = sessions.map((s) => ({
        name: s.name || '',
        tip: [s.name, s.title].filter(Boolean).join(' · '),
        cells: (s.agents && s.agents.length ? s.agents : [{ code: 'ROOT', state: 'idle' }])
          .map((a) => ({ code: a.code, state: a.state })),
      }))
      const shape = isDone ? '' : model.map((r) => r.cells.length).join('-')

      if (shape !== rowShape) {
        rowShape = shape
        el.rows.innerHTML = isDone ? '' : model.map((r) => `<div class="row">
            <span class="who"><span></span></span>
            ${r.cells.map(() => `<div class="cell">
                <div class="k"></div>
                <div class="v"><span class="lamp" data-state="idle"></span><span class="st"></span></div>
              </div>`).join('')}
          </div>`).join('')
      }
      if (isDone) return

      const rows = el.rows.children
      model.forEach((r, i) => {
        const row = rows[i]
        if (!row) return
        const who = row.querySelector('.who')
        who.title = r.tip
        who.firstElementChild.textContent = r.name
        const cells = row.querySelectorAll('.cell')
        r.cells.forEach((c, j) => {
          const cell = cells[j]
          if (!cell) return
          cell.querySelector('.k').textContent = codeLabel(c.code)
          cell.querySelector('.lamp').dataset.state = c.state
          cell.querySelector('.st').textContent = L().cell[c.state] || L().cell.idle
        })
      })
    }

    /* Report the natural content size so the host can fit the window to it.
       `collapsed` rides along so the host can persist which face is showing. */
    let sentW = 0
    let sentH = 0
    let sentCollapsed = null
    let sentBackground = null
    function syncSize() {
      const box = (collapsed ? el.mini : el.card).getBoundingClientRect()
      const w = Math.ceil(box.width)
      const h = Math.ceil(box.height)
      if (w === sentW && h === sentH && collapsed === sentCollapsed
        && background === sentBackground) return
      sentW = w
      sentH = h
      sentCollapsed = collapsed
      sentBackground = background
      try {
        window.webkit.messageHandlers.size.postMessage({ w, h, collapsed, bg: background })
      } catch {}
    }

    function toggle(next) {
      collapsed = typeof next === 'boolean' ? next : !collapsed
      el.card.hidden = collapsed
      el.mini.hidden = !collapsed
      // Re-measure from scratch: the two faces never share a size.
      sentW = 0
      sentH = 0
      syncSize()
    }

    // The host restores the remembered face once the page has loaded.
    window.__lampSetCollapsed = (v) => {
      if (collapsed !== Boolean(v)) toggle(Boolean(v))
    }

    function applyBackground(next) {
      if (!BG_IDS.includes(next) || next === background) return
      background = next
      document.body.dataset.bg = background
      // The host persists it from the size report, so just re-announce.
      sentW = 0
      sentH = 0
      syncSize()
    }

    window.__lampSetBg = applyBackground
    document.body.dataset.bg = background

    el.fold.addEventListener('click', (e) => { e.stopPropagation(); toggle(true) })

    let quitArmed = false
    let quitTimer = null

    function disarmQuit() {
      quitArmed = false
      if (quitTimer) clearTimeout(quitTimer)
      quitTimer = null
      el.quit.dataset.armed = '0'
      el.quit.textContent = '\u00d7'
      el.quit.title = L().quit
    }

    el.quit.addEventListener('click', (e) => {
      e.stopPropagation()
      if (!quitArmed) {
        quitArmed = true
        el.quit.dataset.armed = '1'
        el.quit.textContent = '确认'
        el.quit.title = L().quitConfirm
        quitTimer = setTimeout(disarmQuit, 3000)
        return
      }
      disarmQuit()
      try { window.webkit.messageHandlers.quit.postMessage({}) } catch {}
    })

    el.lang.addEventListener('click', (e) => {
      e.stopPropagation()
      lang = lang === 'zh' ? 'en' : 'zh'
      langPinned = true
      paint(lastData)
      // Same origin as the page, so the board persists the choice itself.
      try { fetch('/lang', { method: 'POST', body: lang }) } catch {}
    })

    /* ---- moving the board ----
       AppKit's own drag machinery (performDrag, movable-by-background) is a
       no-op for this borderless transparent window, and the page cannot name a
       screen position either: this WKWebView reports window.screenX/screenY as
       garbage. So the page only reports WHEN the pointer moved, and the host
       reads the real cursor with NSEvent.mouseLocation. The host also owns the
       click/drag decision, because the window follows the pointer and the
       viewport-relative coordinates here stay still during a drag. */
    let dragging = false

    function sendDrag(phase) {
      try { window.webkit.messageHandlers.drag.postMessage({ phase }) } catch {}
    }

    function onDown(e) {
      if (e.button !== 0) return
      if (e.target.closest && e.target.closest('.fold, .lang, .quit')) return
      dragging = true
      sendDrag('start')
      // Capture on a stable node: the cell markup is replaced on every repaint.
      try { (collapsed ? el.mini : el.card).setPointerCapture(e.pointerId) } catch {}
      e.preventDefault()
    }

    function onMove() {
      if (dragging) sendDrag('move')
    }

    function onUp() {
      if (!dragging) return
      dragging = false
      sendDrag('end')
    }

    // Called back by the host when a gesture turned out to be a click, not a drag.
    window.__lampClick = () => {
      if (collapsed) toggle(false)
    }

    document.addEventListener('pointerdown', onDown, true)
    document.addEventListener('pointermove', onMove, true)
    document.addEventListener('pointerup', onUp, true)
    document.addEventListener('pointercancel', onUp, true)

    // The window is exactly the size of the card, so an in-page popup would be
    // clipped. Hand the gesture to the host, which pops a native menu.
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault()
      try { window.webkit.messageHandlers.menu.postMessage({}) } catch {}
    })

    async function tick() {
      try {
        const res = await fetch('/api', { cache: 'no-store' })
        paint(await res.json())
      } catch {}
    }
    // Render the idle face in the default language before the first poll lands.
    paint(lastData)
    tick()
    setInterval(tick, 400)
  </script>
</body>
</html>
